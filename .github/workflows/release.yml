name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-test:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runs-on }}
    needs: linux-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: dtui-linux-amd64
          - runs-on: macos-latest
            goos: darwin
            goarch: amd64
            artifact: dtui-darwin-amd64
          - runs-on: windows-latest
            goos: windows
            goarch: amd64
            artifact: dtui-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          DTUI_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X internal/buildinfo.version=${DTUI_VERSION}" \
            -o "dist/${{ matrix.artifact }}" \
            ./cmd/docker-tui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dtui-*
          merge-multiple: true
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
